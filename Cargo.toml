[workspace]
resolver = "2"
members = [
    "crates/rose-core",
    "crates/rose-io",
    "crates/rose-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/ziwenzhu/ROSE-RS"
homepage = "https://github.com/ziwenzhu/ROSE-RS"
readme = "README.md"
keywords = ["bioinformatics", "chip-seq", "super-enhancer", "rose", "genomics"]
categories = ["science", "command-line-utilities"]

[workspace.dependencies]
rose-core = { path = "crates/rose-core", version = "1.0.0" }
rose-io = { path = "crates/rose-io", version = "1.0.0" }
noodles = { version = "0.119", features = ["bam", "bgzf", "cram", "csi", "fasta", "sam", "core"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
rayon = "1.10"
xxhash-rust = { version = "0.8", features = ["xxh3", "const_xxh3"] }
clap = { version = "4.5", features = ["derive"] }
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "bitmap_backend", "bitmap_encoder", "ab_glyph", "line_series", "point_series"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
